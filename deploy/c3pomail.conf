# ============================================
# c3pomail.conf — VirtualHost Apache para Oracle Linux 9
# ============================================
# Instalação:
#   1. Copie para /etc/httpd/conf.d/c3pomail.conf
#   2. Habilite os módulos: mod_proxy, mod_proxy_http, mod_ssl, mod_ratelimit, mod_headers
#   3. Execute: sudo systemctl restart httpd
# ============================================

# Redireciona TODO o tráfego HTTP para HTTPS (porta 80 bloqueada)
<VirtualHost *:80>
    ServerName seu-dominio.com.br
    RewriteEngine On
    RewriteRule ^(.*)$ https://%{HTTP_HOST}$1 [R=301,L]
</VirtualHost>

# VirtualHost HTTPS com proxy reverso para o Spring Boot
<VirtualHost *:443>
    ServerName seu-dominio.com.br

    # ========== SSL/TLS ==========
    SSLEngine on
    SSLCertificateFile /etc/pki/tls/certs/seu-certificado.crt
    SSLCertificateKeyFile /etc/pki/tls/private/sua-chave.key
    SSLCertificateChainFile /etc/pki/tls/certs/sua-cadeia.crt

    # Protocolos e cifras seguras (TLS 1.2+ obrigatório)
    SSLProtocol all -SSLv2 -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite HIGH:!aNULL:!MD5:!3DES:!RC4

    # ========== Cabeçalhos de Segurança ==========
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # ========== Rate Limiting (mod_ratelimit) ==========
    # Limita a largura de banda por conexão a 500 KB/s
    <Location /api/c3pomail/>
        SetOutputFilter RATE_LIMIT
        SetEnv rate-limit 500
    </Location>

    # ========== Proxy Reverso ==========
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8080/
    ProxyPassReverse / http://127.0.0.1:8080/

    # Repassa cabeçalhos de origem para o Spring Boot
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    # ========== Logs do Apache ==========
    ErrorLog /var/log/httpd/c3pomail-error.log
    CustomLog /var/log/httpd/c3pomail-access.log combined
</VirtualHost>
