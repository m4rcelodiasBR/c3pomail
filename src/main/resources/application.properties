# ============================================
# application.properties — API c3pomail
# ============================================

# --- Servidor ---
server.port=8081
server.forward-headers-strategy=native

# --- Virtual Threads (Alta Concorrência I/O) ---
spring.threads.virtual.enabled=true

# --- SMTP (Credenciais injetadas via variáveis de ambiente) ---
spring.mail.host=${SMTP_HOST}
spring.mail.port=${SMTP_PORT}
spring.mail.username=${SMTP_USUARIO}
spring.mail.password=${SMTP_SENHA}

# --- API (Configurações de negócio) ---
api.email.remetente=${EMAIL_REMETENTE}
api.email.chave=${API_KEY}

# --- Rate Limiting ---
api.ratelimit.requisicoes-por-minuto=30

# --- Actuator (Health Check) ---
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never