<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Testes | C3PO Mail API</title>
    <link rel="stylesheet" href="lib/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="lib/bootstrap-icons/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="lib/quill/quill.snow.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Header / Nav -->
    <nav class="navbar fixed-top bg-premium-dark">
        <div class="container-fluid px-4">
            <div class="d-flex flex-column align-items-start">
                <span class="brand-title fs-5 mb-0"><i class="bi bi-envelope-paper me-2"></i>C3PO Mail API</span>
                <span class="brand-subtitle" style="font-size: 0.85rem;">Painel de teste - Uso interno</span>
            </div>

            <div class="d-flex align-items-center">
                <div id="statusIndicator" class="status-indicator">
                    <div class="status-dot"></div>
                    <span id="textoStatus">Aguardando...</span>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container my-4"> <!-- my-5 para my-4 (menos margem topo/fundo) -->
        <div class="row justify-content-center">
            <div class="col-lg-10 col-xl-9">
                <div class="card card-premium my-3">
                    <div class="card-header card-header-premium">
                        <!-- Reduzido de h4 para fs-5 -->
                        <h5 class="mb-0 fs-5"><i class="bi bi-send-fill me-2"></i>Enviar e-mails</h5>
                    </div>
                    <div class="card-body p-3 p-md-4"> <!-- Reduzido padding interno (era p-4 p-md-5) -->
                        <form id="formularioEmail" onsubmit="event.preventDefault(); enviarFormulario();">
                            
                            <div class="form-floating mb-3"> <!-- Reduzido de mb-4 para mb-3 -->
                                <input type="password" class="form-control" id="campoApiKey" placeholder="Sua chave secreta" autocomplete="off">
                                <label for="campoApiKey"><i class="bi bi-key-fill me-2"></i>Chave de API (X-API-KEY)</label>
                                <div id="erroApiKey" class="invalid-feedback"></div>
                            </div>

                            <div class="row mb-3"> <!-- Reduzido de mb-4 para mb-3 -->
                                <div class="col-md-6 mb-3 mb-md-0">
                                    <div class="form-floating">
                                        <input type="text" class="form-control" id="campoDestinatarios" placeholder="Separados por vírgula">
                                        <label for="campoDestinatarios"><i class="bi bi-person-lines-fill me-2"></i>Destinatários</label>
                                        <div id="erroDestinatarios" class="invalid-feedback"></div>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-floating">
                                        <input type="text" class="form-control" id="campoCopias" placeholder="Separados por vírgula">
                                        <label for="campoCopias"><i class="bi bi-people-fill me-2"></i>Cópias Ocultas (BCC) - Opc. </label>
                                        <div id="erroCopias" class="invalid-feedback"></div>
                                    </div>
                                </div>
                            </div>

                            <div class="form-floating mb-3"> <!-- Reduzido de mb-4 para mb-3 -->
                                <input type="text" class="form-control" id="campoAssunto" placeholder="Assunto do E-mail">
                                <label for="campoAssunto"><i class="bi bi-chat-left-text-fill me-2"></i>Assunto</label>
                                <div id="erroAssunto" class="invalid-feedback"></div>
                            </div>

                            <!-- Editor Quill -->
                            <div class="editor-wrapper mb-3" id="wrapperCorpo"> <!-- mb-3 -->
                                <span class="editor-label"><i class="bi bi-file-earmark-richtext-fill me-2"></i>Corpo do E-mail (HTML)</span>
                                <div id="editor-container"></div>
                                <div id="erroCorpo" class="text-danger small mt-1" style="display:none;"></div>
                            </div>

                            <div class="d-grid mt-2">
                                <!-- Botão menor: removido btn-lg e py-3, adicionado py-2 e fonte menor -->
                                <button type="submit" id="botaoEnviar" class="btn btn-premium py-2">
                                    <span id="loaderEnviar" class="spinner-border spinner-border-sm d-none me-2" role="status" aria-hidden="true"></span>
                                    <span class="fs-6"><i class="bi bi-rocket-takeoff-fill me-2"></i>Enviar E-mail</span>
                                </button>
                            </div>

                        </form>

                        <div id="painelResposta" class="mt-3 d-none">
                            <div id="alertaResposta" class="alert py-2 mb-0" role="alert">
                                <div id="msgResposta" class="fs-6"></div>
                                <div id="protocoloResposta" class="mt-1 font-monospace small"></div>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer fixed-bottom bg-premium-dark py-2"> <!-- py-2 mais fino -->
        <div class="container text-center">
            <span class="text-muted"><i class="bi bi-robot me-2"></i>C3PO Mail v1.0.0 &mdash; API de envio de e-mails centralizada</span>
        </div>
    </footer>

    <script src="lib/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="lib/quill/quill.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
