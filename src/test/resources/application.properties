# ============================================
# application.properties — Perfil de Teste
# ============================================

server.port=0
server.forward-headers-strategy=native
spring.threads.virtual.enabled=false

# SMTP de teste (valores fixos, sem depender de variáveis de ambiente)
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=teste
spring.mail.password=teste
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# API de teste
api.email.remetente=teste@c3pomail.local
api.email.chave=chave-teste-segura-256-bits

# Rate Limiting de teste
api.ratelimit.requisicoes-por-minuto=100

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.mail.enabled=false
